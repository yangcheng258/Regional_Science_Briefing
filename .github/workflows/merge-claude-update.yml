name: Merge weekly update branch into main
on:
  push:
    branches: ["claude/journal-watch"]
permissions:
  contents: write
concurrency:
  group: merge-claude-update
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge claude/journal-watch into main
        run: |
          git config user.name "journal-watch-bot"
          git config user.email "actions@github.com"
          git fetch origin claude/journal-watch
          git merge --no-edit origin/claude/journal-watch
          git push origin main
