<style>
  :root {
    --bg: #f6f4ef;

    --line: #d8d4ca;
    --card: #fbfaf6;
    --accent: #4a5d3a;
    --accent-soft: #e8ebe0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    background: #e8e5de;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* --- Variant switcher --- */
  .switcher {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 2px;
    padding: 4px;
    background: rgba(20,20,20,0.88);
    backdrop-filter: blur(16px);
    border-radius: 999px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }
  .switcher button {
    appearance: none;
    border: 0;
    background: transparent;
    color: #d5d1c5;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .switcher button:hover { color: #fff; }
  .switcher button.active {
    background: #f6f4ef;
    color: #1a1a1a;
  }
  .switcher .label {
    color: #8a8680;
    font-size: 11px;
    padding: 8px 10px 8px 14px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* --- Variant container --- */
  .variant {
    display: none;
    min-height: 100vh;
  }
  .variant.active { display: block; }
</style>
</head>

<!-- TWEAKS -->
<script>
  const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
    "accent": "#4a5d3a",
    "bg": "#f6f4ef",
    "fg": "#1a1a1a"
  }/*EDITMODE-END*/;
  const tweakState = { ...TWEAK_DEFAULS };

  function applyTweaks() {
    document.documentElement.style.setProperty('--accent', tweakState.accent);
    document.documentElement.style.setProperty('--bg', tweakState.bg);
    document.documentElement.style.setProperty('--fg', tweakState.fg);
    // derive soft accent
    const hex = tweakState.accent.replace('#','');
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.10)`);
  }
  applyTweaks();

  // Variant switching with persistence
  const savedVariant = localStorage.getItem('yc-variant') || 'v4';
  const showVariant = (id) => {
    document.querySelectorAll('.variant').forEach(v => v.classList.toggle('active', v.id === id));
    document.querySelectorAll('.switcher button').forEach(b => b.classList.toggle('active', b.dataset.variant === id));
    localStorage.setItem('yc-variant', id);
    window.scrollTo(0, 0);
  };
  document.querySelectorAll('.switcher button').forEach(b => {
    b.addEventListener('click', () => showVariant(b.dataset.variant));
  });
  // Apply saved variant on load
  window.addEventListener('DOMContentLoaded', () => showVariant(savedVariant));

  // Edit mode
  let tweaksPanel = null;
  function makeTweaksPanel() {
    const el = document.createElement('div');
    el.id = 'tweaks-panel';
    el.innerHTML = `
      <style>
        #tweaks-panel {
          position: fixed; bottom: 20px; right: 20px; z-index: 200;
          width: 260px; padding: 16px 18px;
          background: rgba(20,20,20,0.92); backdrop-filter: blur(16px);
          color: #e5e1d5; border-radius: 14px;
          font-family: 'Geist', sans-serif; font-size: 13px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        #tweaks-panel h4 { margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #8a8680; font-weight: 500; }
        #tweaks-panel label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        #tweaks-panel input[type=color] { width: 32px; height: 24px; border: 1px solid #444; border-radius: 4px; background: transparent; padding: 0; cursor: pointer; }
        #tweaks-panel .presets { display: flex; gap: 6px; margin-top: 6px; }
        #tweaks-panel .presets button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; padding: 0; }
      </style>
      <h4>Tweaks</h4>
      <label>Accent <input type="color" id="tw-accent" value="${tweakState.accent}"></label>
      <div class="presets">
        <button style="background:#4a5d3a" data-c="#4a5d3a" title="Moss"></button>
        <button style="background:#8b3a2a" data-c="#8b3a2a" title="Rust"></button>
        <button style="background:#2a4a6b" data-c="#2a4a6b" title="Navy"></button>
        <button style="background:#6b4a2a" data-c="#6b4a2a" title="Tobacco"></button>
        <button style="background:#1a1a1a" data-c="#1a1a1a" title="Mono"></button>
      </div>
      <label style="margin-top:14px">Background <input type="color" id="tw-bg" value="${tweakState.bg}"></label>
      <label>Text <input type="color" id="tw-fg" value="${tweakState.fg}"></label>
    `;
    document.body.appendChild(el);
    const persist = () => {
      applyTweaks();
      window.parent.postMessage({type: '__edit_mode_set_keys', edits: tweakState}, '*');
    };
    el.querySelector('#tw-accent').addEventListener('input', e => { tweakState.accent = e.target.value; persist(); });
    el.querySelector('#tw-bg').addEventListener('input', e => { tweakState.bg = e.target.value; persist(); });
    el.querySelector('#tw-fg').addEventListener('input', e => { tweakState.fg = e.target.value; persist(); });
    el.querySelectorAll('.presets button').forEach(b => {
      b.addEventListener('click', () => {
        tweakState.accent = b.dataset.c;
        el.querySelector('#tw-accent').value = b.dataset.c;
        persist();
      });
    });
    return el;
  }
  window.addEventListener('message', (e) => {
    if (!e.data || !e.data.type) return;
    if (e.data.type === '__activate_edit_mode') {
      if (!tweaksPanel) tweaksPanel = makeTweaksPanel();
      tweaksPanel.style.display = 'block';
    }
    if (e.data.type === '__deactivate_edit_mode') {
      if (tweaksPanel) tweaksPanel.style.display = 'none';
    }
  });
  window.parent.postMessage({type: '__edit_mode_available'}, '*');
</script>
